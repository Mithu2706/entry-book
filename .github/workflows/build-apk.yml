name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: 3. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: 6. Prebuild Android native files
        working-directory: mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://xyxbebqxsehmoqowpkmg.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5eGJlYnF4c2VobW9xb3dwa21nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzEyMzksImV4cCI6MjEwNjk0NzIzOX0.AbKd6mRz-GdBXceB1WgjEcrwO-EstiVqiAXzoWU3SwI' }}
        run: npx expo prebuild --platform android --clean

      - name: 7. Build APK with Gradle
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 8. Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: entry-book-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 7
